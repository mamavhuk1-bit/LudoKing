<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at center, #991b1b 0%, #450a0a 100%);
    font-family: 'Segoe UI', Roboto, sans-serif; color: #fff;
  }
  .bg-pattern {
    position: fixed; inset: -50%; width: 200%; height: 200%; z-index: 0; opacity: 0.14;
    background-image: repeating-linear-gradient(45deg, #facc15 0, #facc15 2px, transparent 2px, transparent 54px),
                      repeating-linear-gradient(-45deg, #facc15 0, #facc15 2px, transparent 2px, transparent 54px);
    pointer-events: none;
  }
  .screen {
    position: relative; z-index: 2; width: 100%; height: 100%;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px;
  }
  .screen.active { display: flex; }

  /* স্ক্রিন ১: Snakes & Ladders Home (1000105165.jpg) */
  .banner {
    background: linear-gradient(180deg, #115e59, #042f2e);
    border: 4px solid #facc15; border-radius: 26px; padding: 14px 28px;
    text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.6); margin-bottom: 26px;
  }
  .banner .sub { font-size: 14px; font-weight: 900; color: #fde047; letter-spacing: 2px; }
  .banner .main { font-size: 26px; font-weight: 900; color: #facc15; text-shadow: 0 3px 0 #713f12; }

  .menu-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 380px; margin-bottom: 26px;
  }
  .menu-card {
    background: linear-gradient(180deg, #0d9488 0%, #065f46 52%, #facc15 53%, #eab308 100%);
    border: 3.5px solid #fef08a; border-radius: 18px; padding: 12px 8px 10px;
    text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,0.55); cursor: pointer;
  }
  .menu-card:active { transform: scale(0.95); }
  .menu-icon { font-size: 30px; margin-bottom: 10px; }
  .menu-title { font-size: 13.5px; font-weight: 900; color: #fff; text-shadow: 0 1.5px 2px #000; line-height: 1.15; }
  .menu-live { font-size: 10.5px; color: #bbf7d0; margin-top: 4px; font-weight: bold; }

  .bottom-circles { display: flex; gap: 22px; }
  .circle-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: linear-gradient(180deg, #0d9488, #115e59);
    border: 3.5px solid #facc15; display: flex; align-items: center; justify-content: center;
    font-size: 26px; box-shadow: 0 5px 14px rgba(0,0,0,0.5);
  }

  /* স্ক্রিন ২ ও ৩: Choose Theme & Choose Board (1000105166 - 1000105169) */
  .heading-gold {
    font-size: 26px; font-weight: 900; color: #facc15;
    text-shadow: 0 3px 4px #000; margin-bottom: 10px;
  }
  .pill-dark {
    background: #2b0909; border: 2.5px solid #facc15; border-radius: 26px;
    padding: 8px 38px; font-size: 20px; font-weight: 900; color: #facc15; margin-bottom: 14px;
  }
  .preview-box {
    width: min(74vw, 310px); height: min(74vw, 310px);
    background: #fce7f3; border: 4px solid #facc15; border-radius: 8px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.65); overflow: hidden; margin-bottom: 18px;
  }
  .nav-row { display: flex; align-items: center; gap: 22px; }
  .tri-btn {
    font-size: 38px; color: #facc15; text-shadow: 0 3px 5px #000; cursor: pointer; padding: 4px 10px;
  }
  .select-btn {
    background: linear-gradient(180deg, #0d9488, #065f46);
    border: 3.5px solid #facc15; border-radius: 28px; padding: 10px 44px;
    font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 2px 3px #000;
    box-shadow: 0 6px 15px rgba(0,0,0,0.55);
  }

  /* স্ক্রিন ৪: Choose Color & Name (1000105170.jpg) */
  .player-card {
    width: 100%; max-width: 390px;
    background: linear-gradient(180deg, #5c0a0a, #3b0505);
    border: 3px solid #facc15; border-radius: 16px; padding: 20px 16px;
    box-shadow: 0 0 25px rgba(250, 204, 21, 0.35); text-align: center;
  }
  .name-list { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 18px; max-height: 36vh; overflow-y: auto; }
  .name-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .pin-dot { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 2px solid #fff; flex-shrink: 0; }
  .name-input {
    width: 210px; padding: 8px 14px; border-radius: 8px; border: 2px dashed #94a3b8;
    background: #fff; color: #0f172a; font-weight: 800; font-size: 15px;
  }
  .count-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .cnt-btn {
    width: 62px; height: 46px; border-radius: 22px;
    background: #2b0909; border: 2.5px solid #78350f; color: #94a3b8;
    font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center;
  }
  .cnt-btn.active {
    background: linear-gradient(180deg, #0d9488, #065f46);
    border-color: #facc15; color: #fff; box-shadow: 0 0 14px rgba(250,204,21,0.6);
  }
  .back-btn {
    position: fixed; left: 16px; bottom: 18px; z-index: 5;
    width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(180deg, #0d9488, #065f46);
    border: 3px solid #facc15; color: #facc15; font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
<div class="bg-pattern"></div>

<!-- ১. Snakes & Ladders Home -->
<div class="screen active" id="scr-home">
  <div class="banner">
    <div class="main">SNAKES</div>
    <div class="sub">AND</div>
    <div class="main">LADDERS</div>
  </div>

  <div class="menu-grid">
    <div class="menu-card" onclick="SnakeBridge.onServerError()">
      <div class="menu-icon">📱🌐📱</div>
      <div class="menu-title">PLAY<br>ONLINE</div>
      <div class="menu-live">● Players : 390</div>
    </div>
    <div class="menu-card" onclick="SnakeBridge.onServerError()">
      <div class="menu-icon">📱💞📱</div>
      <div class="menu-title">PLAY WITH<br>FRIENDS</div>
      <div class="menu-live">● Players : 2,727</div>
    </div>
    <div class="menu-card" onclick="openTheme(true)">
      <div class="menu-icon">🆚💻</div>
      <div class="menu-title">COMPUTER</div>
    </div>
    <div class="menu-card" onclick="openTheme(false)">
      <div class="menu-icon">👥🎲</div>
      <div class="menu-title">PASS N PLAY</div>
    </div>
  </div>

  <div class="bottom-circles">
    <div class="circle-btn" onclick="SnakeBridge.onServerError()">🏆</div>
    <div class="circle-btn" onclick="SnakeBridge.onTick()">⚙️</div>
    <div class="circle-btn" onclick="SnakeBridge.onBackLudo()" title="Back to Ludo">🎲</div>
  </div>
</div>

<!-- ২. Choose Theme -->
<div class="screen" id="scr-theme">
  <div class="heading-gold">Choose Theme</div>
  <div class="pill-dark" id="themeName">Default</div>
  <div class="preview-box"><canvas id="themeCanvas" width="300" height="300"></canvas></div>
  <div class="nav-row">
    <div class="tri-btn" onclick="cycleTheme(-1)">◀</div>
    <button class="select-btn" onclick="goBoard()">SELECT</button>
    <div class="tri-btn" onclick="cycleTheme(1)">▶</div>
  </div>
</div>

<!-- ৩. Choose Board (Board 1, Board 2, Board 3) -->
<div class="screen" id="scr-board">
  <div class="heading-gold">Choose Board</div>
  <div class="pill-dark" id="boardName">Board 1</div>
  <div class="preview-box"><canvas id="boardCanvas" width="300" height="300"></canvas></div>
  <div class="nav-row">
    <div class="tri-btn" onclick="cycleBoard(-1)">◀</div>
    <button class="select-btn" onclick="goPlayers()">SELECT</button>
    <div class="tri-btn" onclick="cycleBoard(1)">▶</div>
  </div>
</div>

<!-- ৪. Choose Color and Name (2P - 6P) -->
<div class="screen" id="scr-players">
  <div class="player-card">
    <div class="heading-gold" style="font-size:19px">CHOOSE COLOR AND NAME</div>
    <div class="name-list" id="nameList"></div>
    <div class="count-grid" id="countGrid"></div>
    <button class="select-btn" style="padding:10px 54px" onclick="startMatch()">Play</button>
  </div>
</div>

<button class="back-btn" onclick="handleBack()">↩</button>

<script>
let currentStep = 'scr-home';
let vsComp = false;
let themeIdx = 0;
let boardIdx = 0; // 0 = Board 1, 1 = Board 2, 2 = Board 3
let playerCount = 2;
const themes = ['Default', 'Royal Gold', 'Jungle Night'];
const pinColors = ['#1882E8', '#E32626', '#1E9E3E', '#F5C71A', '#A855F7', '#F97316'];
let names = ['Player 1', 'Player 2', 'Player 3', 'Player 4', 'Player 5', 'Player 6'];

const BOARDS = [
  { ladders: [[4,25],[13,46],[33,49],[42,63],[50,69],[62,81],[74,92]], snakes: [[27,5],[40,3],[43,18],[54,31],[66,45],[76,58],[89,53],[99,41]] },
  { ladders: [[3,22],[8,34],[20,41],[28,55],[37,65],[51,72],[64,83],[79,98]], snakes: [[24,4],[38,16],[47,26],[59,39],[71,48],[85,61],[94,68],[97,75]] },
  { ladders: [[5,27],[11,31],[19,42],[29,52],[44,66],[57,78],[70,91],[82,96]], snakes: [[21,2],[35,14],[49,25],[63,36],[77,54],[88,62],[93,71],[98,59]] }
];

function showScr(id) {
  currentStep = id;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function openTheme(comp) {
  vsComp = comp;
  SnakeBridge.onTick();
  showScr('scr-theme');
  drawMiniBoard('themeCanvas', 0, themeIdx);
}

function cycleTheme(dir) {
  themeIdx = (themeIdx + dir + themes.length) % themes.length;
  document.getElementById('themeName').textContent = themes[themeIdx];
  SnakeBridge.onTick();
  drawMiniBoard('themeCanvas', 0, themeIdx);
}

function goBoard() {
  SnakeBridge.onTick();
  showScr('scr-board');
  drawMiniBoard('boardCanvas', boardIdx, themeIdx);
}

function cycleBoard(dir) {
  boardIdx = (boardIdx + dir + 3) % 3;
  document.getElementById('boardName').textContent = 'Board ' + (boardIdx + 1);
  SnakeBridge.onTick();
  drawMiniBoard('boardCanvas', boardIdx, themeIdx);
}

function goPlayers() {
  SnakeBridge.onTick();
  showScr('scr-players');
  renderPlayerSetup();
}

function renderPlayerSetup() {
  const list = document.getElementById('nameList');
  list.innerHTML = '';
  for (let i = 0; i < playerCount; i++) {
    list.innerHTML += `<div class="name-row">
      <div class="pin-dot" style="background:${pinColors[i]}"></div>
      <input class="name-input" value="${names[i]}" onchange="names[${i}]=this.value">
    </div>`;
  }
  const grid = document.getElementById('countGrid');
  grid.innerHTML = '';
  [2,3,4,5,6].forEach(c => {
    grid.innerHTML += `<div class="cnt-btn ${c===playerCount?'active':''}" onclick="setCnt(${c})">${c}P</div>`;
  });
}

function setCnt(c) {
  playerCount = c;
  SnakeBridge.onTick();
  renderPlayerSetup();
}

function startMatch() {
  SnakeBridge.onStartSnakeGame(boardIdx, playerCount, JSON.stringify(names.slice(0, playerCount)), vsComp);
}

function handleBack() {
  SnakeBridge.onTick();
  if (currentStep === 'scr-players') showScr('scr-board');
  else if (currentStep === 'scr-board') showScr('scr-theme');
  else if (currentStep === 'scr-theme') showScr('scr-home');
  else SnakeBridge.onBackLudo();
}

function cellXY(n, cs) {
  const idx = n - 1, rB = Math.floor(idx / 10), cIn = idx % 10;
  const col = (rB % 2 === 0) ? cIn : (9 - cIn), row = 9 - rB;
  return [(col + 0.5) * cs, (row + 0.5) * cs];
}

function drawMiniBoard(cid, bIdx, tIdx) {
  const c = document.getElementById(cid), ctx = c.getContext('2d'), cs = 30;
  const palettes = [['#fce7f3','#fff1f2'], ['#fef3c7','#fffbeb'], ['#dbeafe','#eff6ff']];
  for (let n = 1; n <= 100; n++) {
    const [x, y] = cellXY(n, cs);
    ctx.fillStyle = palettes[tIdx][n % 2];
    ctx.fillRect(x - cs/2, y - cs/2, cs, cs);
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
    ctx.strokeRect(x - cs/2, y - cs/2, cs, cs);
    ctx.fillStyle = '#1e293b'; ctx.font = 'bold 9px sans-serif';
    ctx.fillText(n, x - cs/2 + 2, y - cs/2 + 10);
  }
  const b = BOARDS[bIdx];
  ctx.strokeStyle = '#0284c7'; ctx.lineWidth = 3;
  b.ladders.forEach(([s, e]) => {
    const [x1, y1] = cellXY(s, cs), [x2, y2] = cellXY(e, cs);
    ctx.beginPath(); ctx.moveTo(x1-4, y1); ctx.lineTo(x2-4, y2); ctx.moveTo(x1+4, y1); ctx.lineTo(x2+4, y2); ctx.stroke();
  });
  ctx.strokeStyle = '#16a34a'; ctx.lineWidth = 4;
  b.snakes.forEach(([h, t]) => {
    const [x1, y1] = cellXY(h, cs), [x2, y2] = cellXY(t, cs);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo((x1+x2)/2+15, (y1+y2)/2, x2, y2); ctx.stroke();
  });
}
</script>
</body>
</html>
