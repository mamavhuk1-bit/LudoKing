name: Build LudoKing & Remote APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Generate Fixed Deterministic Keystore
        run: |
          rm -f app/ludoking.keystore
          keytool -genkeypair -noprompt \
            -keystore app/ludoking.keystore \
            -alias ludoking \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -startdate "2026/01/01 00:00:00" \
            -storepass LudoKing@2026 \
            -keypass LudoKing@2026 \
            -dname "CN=LudoKing, OU=Games, O=LudoStudio, L=Chattogram, ST=CTG, C=BD"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build Both APKs
        run: gradle assembleDebug
      - name: Upload LudoKing Game APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload LudoRemote Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoRemote-Controller-APK
          path: remote_app/build/outputs/apk/debug/remote_app-debug.apk